requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "litellm>=1.104.1",
    "bcrypt>=4.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.3.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
